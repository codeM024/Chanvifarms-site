<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Chanvifarm_lcon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f6f43" />
    <meta name="description" content="Chanvi Farms - fresh organic vegetables, fruits and groceries delivered from the farm to your door." />
    <title>Chanvi Farms</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..800&family=Plus+Jakarta+Sans:wght@400..800&display=swap" />
    <!-- FontAwesome: loaded without blocking first paint -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'" />
    <style>
      /* Instant paint before JS loads */
      html, body { background: #f7faf5; margin: 0; }
      #root:empty { min-height: 100vh; display: grid; place-items: center; }
      #root:empty::after { content: ''; width: 36px; height: 36px; border-radius: 50%; border: 3px solid #d7ead9; border-top-color: #1f6f43; animation: boot-spin .8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
